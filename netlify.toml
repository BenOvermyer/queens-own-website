[build]
  # Production bakes the canonical host from config.toml, so pages and assets
  # (including the preloaded fonts) stay same-origin for every visitor.
  command = 'python3 scripts/build.py'
  publish = "public"

[build.environment]
  ZOLA_VERSION = "0.23.6"

# Preview and branch deploys keep their own deploy URL so links stay on the
# preview site. Cross-host font requests are allowed by static/_headers.
[context.deploy-preview]
  command = 'python3 scripts/build.py --base-url "$DEPLOY_PRIME_URL"'

[context.branch-deploy]
  command = 'python3 scripts/build.py --base-url "$DEPLOY_PRIME_URL"'
