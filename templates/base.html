<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="stylesheet" href="{{ get_url(path='css/site.css') }}">
</head>
<body {% block appearance %}{% endblock appearance %}>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ get_url(path='/') }}">Queen’s Own<span>The official Mercedes Lackey fan club</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ get_url(path='membership/') }}">Membership</a>
      <a href="{{ get_url(path='personas/') }}">Personas</a>
      <a href="{{ get_url(path='world/') }}">World reference</a>
      <a href="{{ get_url(path='community/') }}">Community</a>
      <a href="{{ get_url(path='publications/') }}">Publications</a>
      <a href="{{ get_url(path='archive/') }}">Archive</a>
    </nav>
  </header>
  <main id="main">{% block content %}{% endblock content %}</main>
  <footer><a href="{{ get_url(path='legal-notices/') }}">Legal notices</a> · <a href="{{ get_url(path='privacy-policy/') }}">Privacy policy</a></footer>
</body>
</html>
