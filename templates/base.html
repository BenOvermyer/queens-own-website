<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="stylesheet" href="{{ get_url(path='css/site.css') }}">
</head>
<body {% block appearance %}{% endblock appearance %}>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ get_url(path='/') }}">Queen’s Own<span>The official Mercedes Lackey fan club</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ get_url(path='qojoin.htm') }}">Join</a>
      <a href="{{ get_url(path='qohandouts.htm') }}">Personas</a>
      <a href="{{ get_url(path='qonews.htm') }}">Newsletters</a>
      <a href="{{ get_url(path='qofanfic.htm') }}">Fan fiction</a>
      <a href="{{ get_url(path='archive/') }}">Archive</a>
    </nav>
  </header>
  <main id="main">{% block content %}{% endblock content %}</main>

</body>
</html>
