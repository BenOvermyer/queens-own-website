# Canonical production host. `zola serve` overrides this for local previews,
# and Netlify overrides it with the deploy URL on preview/branch builds (see
# netlify.toml). Keeping it fixed in production means asset and page URLs stay
# same-origin regardless of which Netlify hostname serves the request.
base_url = "https://www.queensown.org"
title = "Queen's Own"
description = "The official Mercedes Lackey fan club — community, personas, stories, and an archive of newsletters."
compile_sass = false
build_search_index = false

[extra]
# Public download host for the PDF archive.
pdf_base_url = "https://files.queensown.org"

# Shared sign-off that closes club pages. The signoff component in
# templates/components.html renders it, so changing the salutation, name, or
# address here updates every page at once.
[extra.signoff]
salutation = "Zhai'helleva"
name = "Herald-Mage Adept Danya Winterborn"
email = "shashtah@gmail.com"
